<div class="webphone-container">
  <header class="webphone-header">
    <h1>{{ title }}</h1>
  </header>
  
  <app-call-status [status]="callStatus"></app-call-status>
  
  <app-sip-config (configSubmit)="onConfigSubmit($event)"></app-sip-config>
  
  <app-dial-pad (dial)="onDial($event)" (hangup)="onHangup()"></app-dial-pad>
</div>
