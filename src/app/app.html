<div class="app-container">
  <header>
    <h1>RingCentral WebPhone</h1>
    <div class="header-buttons">
      <button class="admin-toggle" (click)="toggleAdminPanel()">
        {{ showAdminPanel ? 'Hide Admin Panel' : 'Show Admin Panel' }}
      </button>
      <button class="sip-toggle" (click)="toggleSipConfig()">
        {{ showSipConfig ? 'Hide SIP Config' : 'Show SIP Config' }}
      </button>
    </div>
  </header>

  <main>
    <div class="admin-section" *ngIf="showAdminPanel">
      <app-admin-panel></app-admin-panel>
    </div>

    <div class="sip-section" *ngIf="showSipConfig">
      <app-sip-config></app-sip-config>
    </div>

    <div class="phone-section">
      <app-dial-pad></app-dial-pad>
    </div>
  </main>

  <footer>
    <p>RingCentral WebPhone Widget for Zoho CRM</p>
  </footer>
</div>
