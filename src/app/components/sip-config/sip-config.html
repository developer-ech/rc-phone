<div class="config-container">
  @if (!isConfigured) {
    <form (ngSubmit)="saveConfig()">
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" [(ngModel)]="config.username" name="username" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" [(ngModel)]="config.password" name="password" required>
      </div>
      
      <div class="form-group">
        <label for="sipServer">SIP Server:</label>
        <input type="text" id="sipServer" [(ngModel)]="config.sipServer" name="sipServer" required>
      </div>
      
      <div class="form-group">
        <label for="wsServer">WebSocket Server:</label>
        <input type="text" id="wsServer" [(ngModel)]="config.wsServer" name="wsServer" required>
      </div>
      
      <div class="form-group">
        <label for="displayName">Display Name (optional):</label>
        <input type="text" id="displayName" [(ngModel)]="config.displayName" name="displayName">
      </div>
      
      <button type="submit" class="save-btn">Save Configuration</button>
    </form>
  } @else {
    <div class="config-summary">
      <h3>SIP Configuration</h3>
      <p><strong>Username:</strong> {{ config.username }}</p>
      <p><strong>SIP Server:</strong> {{ config.sipServer }}</p>
      <button class="edit-btn" (click)="editConfig()">Edit Configuration</button>
    </div>
  }
</div>
